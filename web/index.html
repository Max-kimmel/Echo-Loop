    :root {

      --el-ink: #1f2937;

        --el-border: #1F1F1F;
        --el-ink: #E8EAED;
        --el-primary: #90CAF9;
      }

    @supports (color: light-dark(white, black)) {
      :root {
        --el-bg: light-dark(#F5F6FA, #000000);
        --el-surface: light-dark(#FFFFFF, #0B0B0B);
        --el-border: light-dark(rgba(0, 0, 0, 0.08), #1F1F1F);
        --el-ink: light-dark(#1f2937, #E8EAED);
        --el-primary: light-dark(#1976D2, #90CAF9);
      }
    }

    body {
      margin: 0;
      background: var(--el-bg);
      color: var(--el-ink);
    }

    .noscript-shell {
      max-width: 720px;
      margin: 48px auto;
      padding: 24px 20px;
      border-radius: 16px;
      background: var(--el-surface);
      border: 1px solid var(--el-border);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: var(--el-ink);
    }

    .noscript-shell h1,
    .noscript-shell h2 {
      text-wrap: balance;
    }

    .noscript-shell p {
      text-wrap: pretty;
    }

    .noscript-shell a {
      color: var(--el-primary);
    }
  </style>

      <h1>Echo Loop — Listen-to-Speak English Training App</h1>
      <p><strong>Turn real audio into active spoken English.</strong> Echo Loop guides you step by step through <strong>intensive listening, shadowing, blind listening, retelling, and 7 rounds of spaced review (6 hours to 28 days)</strong> without manual planning.</p>
      <h2>Core Capabilities</h2>
      <ul>
        <li><strong>Automated Learning Loop</strong>: Structured progression from sentence-level comprehension to fluent paragraph retelling.</li>
        <li><strong>Sense-Group Splitting &amp; AI Explanations</strong>: Break down complex English sentences on demand.</li>
        <li><strong>Offline Speech Evaluation &amp; Transcription</strong>: Practice shadowing and generate subtitles privately on your device.</li>
        <li><strong>Contextualized Spaced Review</strong>: Saved hard sentences, words, and sense groups reviewed in original context.</li>
      </ul>
